name: Build cPanel package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify cPanel package
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -d dist/assets
          test -f dist/sitemap.xml
          test -f dist/robots.txt

      - name: Upload cPanel-ready site
        uses: actions/upload-artifact@v4
        with:
          name: kitsonet-cpanel
          path: dist/
          if-no-files-found: error
